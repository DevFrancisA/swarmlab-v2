[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "swarmlab"
version = "0.0.1"
description = "SwarmLab is a simulation in which you can build rooms with obstacles to stop a pre-trained swarm of agents from completing a task."
authors = [
  { name = "Anto Francis" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["swarmlab"]
include = ["pyproject.toml", "swarmlab/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["swarmlab"]
force-sort-within-sections = true

